name: Tests (Postgres CI)

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: contafy
          POSTGRES_PASSWORD: contafy
          POSTGRES_DB: contafy_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install dependencies (lighter)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
      - name: Wait for Postgres
        run: |
          until pg_isready -h 127.0.0.1 -p 5432; do sleep 1; done
      - name: Run migrations and tests
        env:
          DATABASE_URL: postgres://contafy:contafy@127.0.0.1:5432/contafy_ci
          DJANGO_SETTINGS_MODULE: core.test_settings
        run: |
          python manage.py migrate --noinput
          python manage.py test -v 2
