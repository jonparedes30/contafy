name: CI

on:
  push:
    branches: [ main, develop, hardening/roadmap-inicial ]
  pull_request:
    branches: [ main, develop, hardening/roadmap-inicial ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: contafy
          POSTGRES_USER: contafyuser
          POSTGRES_PASSWORD: contafypass
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U contafyuser" --health-interval=10s --health-timeout=5s --health-retries=5

    env:
      DATABASE_URL: postgres://contafyuser:contafypass@localhost:5432/contafy
      SECRET_KEY: testkey
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run flake8
        run: flake8
      - name: Run tests
        run: python manage.py test --keepdb 