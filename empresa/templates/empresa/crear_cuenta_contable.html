{% extends 'empresa/base.html' %}

{% block title %}Crear Cuenta Contable{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h4>Nueva Cuenta Contable</h4>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label for="id_nombre" class="form-label">Nombre de la Cuenta</label>
                            <input type="text" class="form-control" id="id_nombre" name="nombre" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="id_tipo" class="form-label">Tipo de Cuenta</label>
                            <select class="form-select" id="id_tipo" name="tipo" required>
                                <option value="">Selecciona un tipo</option>
                                <option value="activo">Activo</option>
                                <option value="pasivo">Pasivo</option>
                                <option value="capital">Capital</option>
                                <option value="ingreso">Ingreso</option>
                                <option value="gasto">Gasto</option>
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label for="id_monto_inicial" class="form-label">Monto Inicial</label>
                            <input type="number" step="0.01" class="form-control" id="id_monto_inicial" name="monto_inicial" value="0.00">
                        </div>
                        
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">Crear Cuenta</button>
                            <a href="{% url 'empresa:listar_cuentas_contables' %}" class="btn btn-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
