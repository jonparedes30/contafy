<!-- Widget de IA para el menú principal -->
<div class="card border-primary mb-3">
    <div class="card-header bg-primary text-white">
        <h6 class="mb-0">🤖 Asistente IA</h6>
    </div>
    <div class="card-body p-3">
        <div class="mb-2">
            <input 
                type="text" 
                id="ai-widget-input" 
                class="form-control form-control-sm" 
                placeholder="Comando rápido..."
                style="font-size: 12px;"
            >
        </div>
        <div class="d-flex justify-content-between">
            <button 
                id="ai-widget-send" 
                class="btn btn-primary btn-sm"
                style="font-size: 11px;"
            >
                Enviar
            </button>
            <a href="{% url 'ai_comandos_page' %}" class="btn btn-outline-primary btn-sm" style="font-size: 11px;">
                Chat Completo
            </a>
        </div>
        <div id="ai-widget-response" class="mt-2" style="font-size: 11px; max-height: 100px; overflow-y: auto;"></div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const aiInput = document.getElementById('ai-widget-input');
    const aiSendBtn = document.getElementById('ai-widget-send');
    const aiResponse = document.getElementById('ai-widget-response');

    function enviarComandoWidget() {
        const comando = aiInput.value.trim();
        if (!comando) return;

        aiSendBtn.disabled = true;
        aiResponse.innerHTML = '<small class="text-muted">Procesando...</small>';

        fetch('{% url "comando_rapido" %}', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: `comando=${encodeURIComponent(comando)}`
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                aiResponse.innerHTML = `<small class="text-success">${data.mensaje}</small>`;
                aiInput.value = '';
            } else {
                aiResponse.innerHTML = `<small class="text-danger">${data.error}</small>`;
            }
        })
        .catch(error => {
            aiResponse.innerHTML = `<small class="text-danger">Error: ${error.message}</small>`;
        })
        .finally(() => {
            aiSendBtn.disabled = false;
        });
    }

    aiInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            enviarComandoWidget();
        }
    });

    aiSendBtn.addEventListener('click', enviarComandoWidget);

    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }
});
</script>
