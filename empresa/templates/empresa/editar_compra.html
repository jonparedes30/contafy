{% extends 'empresa/base.html' %}

{% block title %}Editar Compra{% endblock %}

{% block content %}
<div class="container mt-5" style="max-width: 600px;">
  <h2 class="mb-4 text-primary text-center">Editar Compra</h2>

  <form method="post" class="border p-4 rounded bg-white shadow-sm">
    {% csrf_token %}

    <div class="mb-3">
      <label class="form-label">Producto</label>
      <input type="text" class="form-control" value="{{ compra.producto.nombre }}" readonly>
    </div>

    <div class="mb-3">
      <label for="cantidad" class="form-label">Cantidad</label>
      <input type="number" id="cantidad" name="cantidad" class="form-control" value="{{ compra.cantidad }}" required>
    </div>

    <div class="mb-3">
      <label for="monto" class="form-label">Monto Total</label>
      <input type="number" id="monto" name="monto" class="form-control" step="0.01" value="{{ compra.monto }}" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Tipo de Pago</label>
      <input type="text" class="form-control" value="{{ compra.get_tipo_pago_display }}" readonly>
    </div>

    <div class="mb-3">
      <label class="form-label">Fecha</label>
      <input type="text" class="form-control" value="{{ compra.fecha|date:'d/m/Y H:i' }}" readonly>
    </div>

    <button type="submit" class="btn btn-primary w-100">Actualizar Compra</button>
    <a href="{% url 'empresa:listar_compras' %}" class="btn btn-secondary w-100 mt-2">Cancelar</a>
  </form>
</div>
{% endblock %}
