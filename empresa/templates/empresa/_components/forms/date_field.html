{#
  Componente reutilizable para campo de fecha
  
  Uso:
  {% include 'empresa/_components/forms/date_field.html' with field=form.fecha_inicio label="Fecha Inicio" %}
#}

<div class="mb-3">
  <label for="{{ field.id_for_label }}" class="form-label">
    {{ label|default:field.label }}
    {% if field.field.required %}<span class="text-danger">*</span>{% endif %}
  </label>
  
  <input type="date" 
         class="form-control {% if field.errors %}is-invalid{% endif %}"
         id="{{ field.id_for_label }}"
         name="{{ field.name }}"
         value="{{ field.value|date:'Y-m-d'|default:'' }}"
         {% if field.help_text %}
           aria-describedby="{{ field.id_for_label }}_help"
         {% endif %}
         {% if field.field.required %}required{% endif %}>
  
  {% if field.help_text %}
    <small id="{{ field.id_for_label }}_help" class="form-text text-muted d-block mt-1">
      {{ field.help_text|safe }}
    </small>
  {% endif %}
  
  {% if field.errors %}
    <div class="invalid-feedback d-block">
      {{ field.errors.0 }}
    </div>
  {% endif %}
</div>
