{#
  Componente reutilizable para campo select/dropdown
  
  Uso:
  {% include 'empresa/_components/forms/select_field.html' with field=form.categoria label="Categoría" %}
#}

<div class="mb-3">
  <label for="{{ field.id_for_label }}" class="form-label">
    {{ label|default:field.label }}
    {% if field.field.required %}<span class="text-danger">*</span>{% endif %}
  </label>
  
  <select class="form-select {% if field.errors %}is-invalid{% endif %}"
          id="{{ field.id_for_label }}"
          name="{{ field.name }}"
          {% if field.help_text %}
            aria-describedby="{{ field.id_for_label }}_help"
          {% endif %}
          {% if field.field.required %}required{% endif %}>
    
    <option value="">-- Seleccionar --</option>
    
    {% for value, label in field.field.choices %}
      <option value="{{ value }}"
              {% if field.value == value or field.value|stringformat:"s" == value|stringformat:"s" %}selected{% endif %}>
        {{ label }}
      </option>
    {% endfor %}
  </select>
  
  {% if field.help_text %}
    <small id="{{ field.id_for_label }}_help" class="form-text text-muted d-block mt-1">
      {{ field.help_text|safe }}
    </small>
  {% endif %}
  
  {% if field.errors %}
    <div class="invalid-feedback d-block">
      {{ field.errors.0 }}
    </div>
  {% endif %}
</div>
