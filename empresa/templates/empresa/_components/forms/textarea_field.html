{#
  Componente reutilizable para campo textarea
  
  Uso:
  {% include 'empresa/_components/forms/textarea_field.html' with field=form.descripcion label="Descripción" rows="4" %}
#}

<div class="mb-3">
  <label for="{{ field.id_for_label }}" class="form-label">
    {{ label|default:field.label }}
    {% if field.field.required %}<span class="text-danger">*</span>{% endif %}
  </label>
  
  <textarea class="form-control {% if field.errors %}is-invalid{% endif %}"
            id="{{ field.id_for_label }}"
            name="{{ field.name }}"
            rows="{{ rows|default:3 }}"
            {% if field.help_text %}
              aria-describedby="{{ field.id_for_label }}_help"
            {% endif %}
            {% if field.field.required %}required{% endif %}
            placeholder="{{ placeholder|default:'' }}">{{ field.value|default:'' }}</textarea>
  
  {% if field.help_text %}
    <small id="{{ field.id_for_label }}_help" class="form-text text-muted d-block mt-1">
      {{ field.help_text|safe }}
    </small>
  {% endif %}
  
  {% if field.errors %}
    <div class="invalid-feedback d-block">
      {{ field.errors.0 }}
    </div>
  {% endif %}
</div>
