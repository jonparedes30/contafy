<div class="card kpi-card h-100
    {% if kpi.type == 'costo' %}warning
    {% elif kpi.type == 'gasto' %}danger
    {% elif kpi.type == 'utilidad' %}{% if kpi.positive %}success{% else %}danger{% endif %}
    {% else %}primary{% endif %}">
    <div class="card-body d-flex align-items-center">
        <div class="kpi-icon-wrapper me-3">
            <i class="bi
                {% if kpi.type == 'costo' %}bi-cart
                {% elif kpi.type == 'gasto' %}bi-receipt
                {% elif kpi.type == 'utilidad' %}bi-cash-stack
                {% else %}bi-graph-up-arrow{% endif %} fs-4"></i>
        </div>
        <div>
            <div class="kpi-label">{{ kpi.label }}</div>
            <div class="kpi-value">${{ kpi.value|floatformat:2 }}</div>
            {% if kpi.note %}
                <span class="badge mt-1">{{ kpi.note }}</span>
            {% endif %}
        </div>
    </div>
</div>
