<!-- Modal reusable para crear proveedor -->
<div class="modal fade" id="modalProveedor" tabindex="-1" aria-labelledby="modalProveedorLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalProveedorLabel">Nuevo Proveedor</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="formProveedor">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="nombre_proveedor" class="form-label">Nombre <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="nombre_proveedor" name="nombre" required>
                    </div>
                    <div class="mb-3">
                        <label for="ruc_proveedor" class="form-label">RUC <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="ruc_proveedor" name="ruc" required>
                    </div>
                    <div class="mb-3">
                        <label for="telefono_proveedor" class="form-label">Teléfono</label>
                        <input type="text" class="form-control" id="telefono_proveedor" name="telefono">
                    </div>
                    <div class="mb-3">
                        <label for="email_proveedor" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email_proveedor" name="email">
                    </div>
                    <div class="mb-3">
                        <label for="dias_credito_proveedor" class="form-label">Días de Crédito</label>
                        <input type="number" class="form-control" id="dias_credito_proveedor" name="dias_credito" value="0">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-primary" id="btnGuardarProveedor">
                    <i class="fas fa-save"></i> Guardar Proveedor
                </button>
            </div>
        </div>
    </div>
</div>
