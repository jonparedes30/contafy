<!-- Componente reutilizable de gráfico de tendencias -->
<div class="card {{ card_class|default:'' }}">
    <div class="card-header">
        <h5 class="mb-0">
            <i class="bi bi-graph-up me-2"></i>
            {{ titulo|default:"Tendencias" }}
        </h5>
    </div>
    <div class="card-body">
        <canvas id="{{ chart_id|default:'trendChart' }}" height="{{ height|default:'100' }}"></canvas>
    </div>
</div>

<script>
(function() {
    const ctx = document.getElementById('{{ chart_id|default:"trendChart" }}');
    if (!ctx) return;
    
    const data = {{ datos|safe }};
    
    new Chart(ctx, {
        type: '{{ tipo|default:"line" }}',
        data: {
            labels: data.labels || [],
            datasets: data.datasets || []
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    display: {{ mostrar_leyenda|default:True|lower }}
                },
                tooltip: {
                    mode: 'index',
                    intersect: false
                }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: {
                        callback: function(value) {
                            return '{{ prefijo|default:"$" }}' + value.toLocaleString();
                        }
                    }
                }
            }
        }
    });
})();
</script>
