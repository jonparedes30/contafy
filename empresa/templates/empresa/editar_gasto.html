{% extends 'empresa/base.html' %}

{% block title %}Editar Gasto{% endblock %}

{% block content %}
<div class="container mt-5" style="max-width: 600px;">
  <h2 class="mb-4 text-danger text-center">Editar Gasto</h2>

  <form method="post" class="border p-4 rounded bg-white shadow-sm">
    {% csrf_token %}

    <div class="mb-3">
      <label for="descripcion" class="form-label">Descripción</label>
      <input type="text" id="descripcion" name="descripcion" class="form-control" value="{{ gasto.descripcion }}" required>
    </div>

    <div class="mb-3">
      <label for="monto" class="form-label">Monto</label>
      <input type="number" id="monto" name="monto" class="form-control" step="0.01" value="{{ gasto.monto }}" required>
    </div>

    <div class="mb-3">
      <label for="categoria" class="form-label">Categoría</label>
      <select id="categoria" name="categoria" class="form-select" required>
        <option value="operativo" {% if gasto.categoria == 'operativo' %}selected{% endif %}>Operativo</option>
        <option value="administrativo" {% if gasto.categoria == 'administrativo' %}selected{% endif %}>Administrativo</option>
        <option value="financiero" {% if gasto.categoria == 'financiero' %}selected{% endif %}>Financiero</option>
        <option value="marketing" {% if gasto.categoria == 'marketing' %}selected{% endif %}>Marketing</option>
        <option value="otro" {% if gasto.categoria == 'otro' %}selected{% endif %}>Otro</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Tipo de Pago</label>
      <input type="text" class="form-control" value="{{ gasto.get_tipo_pago_display }}" readonly>
    </div>

    <div class="mb-3">
      <label class="form-label">Fecha</label>
      <input type="text" class="form-control" value="{{ gasto.fecha|date:'d/m/Y H:i' }}" readonly>
    </div>

    <button type="submit" class="btn btn-primary w-100">Actualizar Gasto</button>
    <a href="{% url 'empresa:listar_gastos' %}" class="btn btn-secondary w-100 mt-2">Cancelar</a>
  </form>
</div>
{% endblock %}
