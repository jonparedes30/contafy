{% extends 'empresa/base_auth.html' %}

{% block title %}Pago cancelado — Contafy{% endblock %}

{% block content %}
<div class="min-vh-100 d-flex align-items-center justify-content-center bg-light py-5">
  <div class="text-center px-3" style="max-width:520px">
    <div class="mb-4">
      <div style="width:80px;height:80px;background:rgba(239,68,68,.1);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;">
        <i class="bi bi-x-circle-fill text-danger" style="font-size:2.5rem"></i>
      </div>
    </div>
    <h2 class="fw-800 mb-2" style="color:#0f172a">Pago cancelado</h2>
    <p class="text-muted mb-4">
      No se realizó ningún cobro. Puedes volver a elegir un plan cuando gustes.
    </p>
    <div class="d-flex flex-column gap-3 mt-4">
      <a href="{% url 'empresa:landing' %}#precios" class="btn btn-primary btn-lg">
        <i class="bi bi-arrow-left me-2"></i>Volver a los planes
      </a>
      <a href="{% url 'empresa:selector_demo' %}" class="btn btn-outline-secondary">
        Explorar demos gratis
      </a>
    </div>
  </div>
</div>
{% endblock %}
