# Render Blueprint para CONTAFY - Academia Duolingo
services:
  - type: web
    name: contafy
    env: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DJANGO_SETTINGS_MODULE
        value: core.settings
      - key: DATABASE_URL
        fromDatabase:
          name: contafy-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: RENDER
        value: "true"
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_EMAIL
        value: admin@contafy.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: CONN_MAX_AGE
        value: "600"
      - key: LOG_LEVEL
        value: "INFO"

databases:
  - name: contafy-db
    databaseName: contafy
    user: contafy
    plan: starter
    region: oregon
