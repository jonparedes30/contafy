# Render Blueprint para CONTAFY - Academia Duolingo

# IMPORTANTE: La base de datos debe crearse PRIMERO
databases:
  - name: contafy-db
    databaseName: contafy
    user: contafy
    plan: starter
    region: oregon
    # PostgreSQL 15 es la versión recomendada
    ipAllowList: []  # Permite todas las IPs por defecto

services:
  - type: web
    name: contafy
    env: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/
    autoDeploy: true
    # Esperar a que la base de datos esté lista
    buildCommand: ./build.sh
    startCommand: gunicorn core.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DJANGO_SETTINGS_MODULE
        value: core.settings
      - key: DATABASE_URL
        fromDatabase:
          name: contafy-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: RENDER
        value: "true"
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_EMAIL
        value: admin@contafy.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: CONN_MAX_AGE
        value: "600"
      - key: LOG_LEVEL
        value: "INFO"
      - key: PYTHONUNBUFFERED
        value: "1"
