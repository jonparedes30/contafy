version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: contafy
      POSTGRES_PASSWORD: contafy
      POSTGRES_DB: contafy_test
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: bash -lc "python manage.py migrate --noinput && python manage.py test -v 2"
    environment:
      DATABASE_URL: postgres://contafy:contafy@db:5432/contafy_test
      DJANGO_SETTINGS_MODULE: core.test_settings
      SECRET_KEY: changeme_for_local
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis

volumes:
  db_data:
